<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KEB Project — Seat Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #161d27;
  --card: #212b3a;
  --border: #344154;

  --text: #eef2f6;
  --muted: #8b98ab;

  --free: #34d399;
  --grace: #f5a524;
  --taken: #f2545b;

  --accent: #5eead4;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 32px 20px 60px;

  background:
    radial-gradient(circle at 15% 0%, #1e2938 0%, transparent 45%),
    radial-gradient(circle at 85% 15%, #1a2431 0%, transparent 50%),
    var(--bg);

  color: var(--text);
  font-family: Inter, sans-serif;
}

.container {
  max-width: 800px;
  margin: auto;
}

/* ---------- HEADER ---------- */

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;

  gap: 20px;
  margin-bottom: 30px;
  padding-bottom: 20px;

  border-bottom: 1px solid var(--border);
}

.eyebrow {
  margin: 0 0 8px;

  color: var(--accent);

  font-family: monospace;
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
}

h1 {
  margin: 0;

  font-family: "Space Grotesk", sans-serif;
  font-size: clamp(28px, 5vw, 40px);
}

.connection {
  display: flex;
  align-items: center;
  gap: 9px;

  color: var(--muted);
  font-size: 13px;
}

.connection-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;

  background: var(--free);
}

/* ---------- LEGEND ---------- */

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;

  margin-bottom: 28px;

  color: var(--muted);
  font-size: 13px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.legend-free {
  background: var(--free);
}

.legend-grace {
  background: var(--grace);
}

.legend-taken {
  background: var(--taken);
}

/* ---------- ROOM ---------- */

.room {
  padding: 28px;

  background: rgba(20, 27, 37, .6);

  border: 1px solid var(--border);
  border-radius: 22px;
}

/* ---------- SEAT MAP ---------- */

.seat-map {
  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 18px;

  max-width: 500px;
  margin: auto;
}

/* ---------- SEAT ---------- */

.seat {
  position: relative;

  min-height: 130px;

  padding: 20px 14px;

  background: var(--card);

  border: 1px solid var(--border);
  border-radius: 16px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  cursor: pointer;
  user-select: none;

  transition:
    transform .2s ease,
    border-color .2s ease,
    background .2s ease;
}

.seat:hover {
  transform: translateY(-2px);
}

.seat-number {
  position: absolute;

  top: 10px;
  left: 12px;

  color: var(--muted);

  font-family: monospace;
  font-size: 12px;
}

.seat-icon {
  width: 34px;
  height: 34px;

  margin-bottom: 10px;

  border-radius: 10px;

  background: #3a4657;

  transition: .2s;
}

.seat-status {
  font-family: "Space Grotesk", sans-serif;
  font-size: 16px;
  font-weight: 600;
}

.seat-detail {
  margin-top: 5px;

  color: var(--muted);

  font-size: 11px;
  text-align: center;
}

/* ---------- STATES ---------- */

.seat.free {
  border-color: rgba(52, 211, 153, .45);
}

.seat.free .seat-icon {
  background: var(--free);
  box-shadow: 0 0 18px rgba(52, 211, 153, .25);
}

.seat.free .seat-status {
  color: var(--free);
}

.seat.taken {
  border-color: rgba(242, 84, 91, .45);
}

.seat.taken .seat-icon {
  background: var(--taken);
  box-shadow: 0 0 18px rgba(242, 84, 91, .25);
}

.seat.taken .seat-status {
  color: var(--taken);
}

.seat.grace {
  border-color: rgba(245, 165, 36, .5);
}

.seat.grace .seat-icon {
  background: var(--grace);
  box-shadow: 0 0 18px rgba(245, 165, 36, .25);
}

.seat.grace .seat-status {
  color: var(--grace);
}

/* ---------- INFO ---------- */

.info {
  display: grid;

  grid-template-columns: repeat(3, 1fr);

  gap: 12px;

  margin-top: 25px;
}

.info-box {
  padding: 14px;

  background: rgba(33, 43, 58, .7);

  border: 1px solid var(--border);
  border-radius: 12px;

  text-align: center;
}

.info-number {
  font-size: 22px;
  font-weight: 700;
}

.info-label {
  margin-top: 4px;

  color: var(--muted);
  font-size: 11px;
}

/* ---------- FOOTER ---------- */

footer {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;

  margin-top: 25px;

  color: var(--muted);

  font-family: monospace;
  font-size: 11px;
}

/* ---------- MOBILE ---------- */

@media (max-width: 650px) {

  header {
    flex-direction: column;
    align-items: flex-start;
  }

  .room {
    padding: 16px;
  }

  .info {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <header>

    <div>
      <p class="eyebrow">KEB Project</p>
      <h1>Seat Availability</h1>
    </div>

    <div class="connection">
      <span class="connection-dot" id="connectionDot"></span>
      <span id="connectionText">
        Demo Mode
      </span>
    </div>

  </header>


  <!-- LEGEND -->

  <div class="legend">

    <div class="legend-item">
      <span class="legend-dot legend-free"></span>
      Available
    </div>

    <div class="legend-item">
      <span class="legend-dot legend-grace"></span>
      Leaving Soon
    </div>

    <div class="legend-item">
      <span class="legend-dot legend-taken"></span>
      Occupied
    </div>

  </div>


  <!-- ROOM -->

  <div class="room">

    <!-- SEAT MAP -->

    <div class="seat-map" id="seatMap"></div>


    <!-- SUMMARY -->

    <div class="info">

      <div class="info-box">
        <div class="info-number" id="freeCount">0</div>
        <div class="info-label">AVAILABLE</div>
      </div>

      <div class="info-box">
        <div class="info-number" id="graceCount">0</div>
        <div class="info-label">LEAVING SOON</div>
      </div>

      <div class="info-box">
        <div class="info-number" id="takenCount">0</div>
        <div class="info-label">OCCUPIED</div>
      </div>

    </div>

  </div>


  <footer>
    <span>Click any seat card to test status toggling</span>
    <span id="lastUpdate">Last updated —</span>
  </footer>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>

/* ============================================================
   SETTINGS
============================================================ */

const GRACE_DURATION_SECONDS = 60;
const SEAT_COUNT = 4;


/* ============================================================
   FIREBASE CONFIG
============================================================ */

const firebaseConfig = {
  apiKey: "",
  databaseURL: "https://YOUR-PROJECT-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "YOUR-PROJECT"
};

const isDemoMode = !firebaseConfig.apiKey;
let db = null;

if (!isDemoMode) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
}


/* ============================================================
   STATE
============================================================ */

let seatState = {};

for (let i = 1; i <= SEAT_COUNT; i++) {
  seatState[i] = {
    status: "free",
    graceUntil: null
  };
}


/* ============================================================
   CREATE SEATS & CLICK EVENT
============================================================ */

const seatMap = document.getElementById("seatMap");

function buildSeats() {
  seatMap.innerHTML = "";

  for (let i = 1; i <= SEAT_COUNT; i++) {
    const seat = document.createElement("div");
    seat.className = "seat";
    seat.id = `seat-${i}`;

    seat.innerHTML = `
      <div class="seat-number">
        Table ${String(i).padStart(2, "0")}
      </div>
      <div class="seat-icon"></div>
      <div class="seat-status">
        Free
      </div>
      <div class="seat-detail">
        Available
      </div>
    `;

    /* Click seat to cycle status for testing */
    seat.addEventListener("click", () => {
      cycleStatus(i);
    });

    seatMap.appendChild(seat);
  }
}


/* ============================================================
   TOGGLE STATUS FOR TESTING
============================================================ */

function cycleStatus(i) {
  const order = ["free", "taken", "grace"];
  const current = seatState[i].status;
  const next = order[(order.indexOf(current) + 1) % order.length];
  const graceUntil = (next === "grace") ? Date.now() + GRACE_DURATION_SECONDS * 1000 : null;

  seatState[i].status = next;
  seatState[i].graceUntil = graceUntil;

  if (!isDemoMode && db) {
    db.ref("seats/" + i).set({
      status: next,
      graceUntil: graceUntil
    });
  }

  render();
}


/* ============================================================
   STATUS TEXT
============================================================ */

function getStatusText(state) {
  if (state.status === "free") {
    return {
      title: "Available",
      detail: "Ready to use"
    };
  }

  if (state.status === "taken") {
    return {
      title: "Occupied",
      detail: "Someone is sitting here"
    };
  }

  if (state.status === "grace") {
    return {
      title: "Leaving Soon",
      detail: getCountdown(state.graceUntil)
    };
  }
}


/* ============================================================
   COUNTDOWN
============================================================ */

function getCountdown(graceUntil) {
  if (!graceUntil) return "Please wait";

  const remaining = Math.max(0, Math.ceil((graceUntil - Date.now()) / 1000));
  const minutes = Math.floor(remaining / 60);
  const seconds = remaining % 60;

  return `Available in ${minutes}:${String(seconds).padStart(2, "0")}`;
}


/* ============================================================
   RENDER
============================================================ */

function render() {
  let free = 0;
  let grace = 0;
  let taken = 0;

  for (let i = 1; i <= SEAT_COUNT; i++) {
    const state = seatState[i];
    const seat = document.getElementById(`seat-${i}`);

    if (!seat) continue;

    seat.className = `seat ${state.status}`;

    const statusText = getStatusText(state);

    seat.querySelector(".seat-status").textContent = statusText.title;
    seat.querySelector(".seat-detail").textContent = statusText.detail;

    if (state.status === "free") free++;
    else if (state.status === "grace") grace++;
    else if (state.status === "taken") taken++;
  }

  document.getElementById("freeCount").textContent = free;
  document.getElementById("graceCount").textContent = grace;
  document.getElementById("takenCount").textContent = taken;

  document.getElementById("lastUpdate").textContent =
    "Last updated " + new Date().toLocaleTimeString('en-US');
}


/* ============================================================
   GRACE TIMER
============================================================ */

setInterval(() => {
  let changed = false;

  for (let i = 1; i <= SEAT_COUNT; i++) {
    const state = seatState[i];

    if (
      state.status === "grace" &&
      state.graceUntil &&
      Date.now() >= state.graceUntil
    ) {
      state.status = "free";
      state.graceUntil = null;
      changed = true;
    }
  }

  if (changed || document.querySelector(".seat.grace")) {
    render();
  }
}, 1000);


/* ============================================================
   INITIALIZE
============================================================ */

buildSeats();

if (isDemoMode) {
  document.getElementById("connectionText").textContent =
    "Demo Mode — Click Seats to Test";
  render();
}


/* ============================================================
   FIREBASE
============================================================ */

else {
  db.ref("seats").on("value", (snapshot) => {
    const data = snapshot.val() || {};

    for (let i = 1; i <= SEAT_COUNT; i++) {
      if (data[i]) {
        seatState[i] = data[i];
      }
    }
    render();
  });

  db.ref(".info/connected").on("value", (snapshot) => {
    const connected = snapshot.val() === true;

    document.getElementById("connectionText").textContent =
      connected ? "Live Connected" : "Disconnected";

    document.getElementById("connectionDot").style.background =
      connected ? "var(--free)" : "var(--taken)";
  });
}

</script>

</body>
</html>
